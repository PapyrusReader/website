name: Website build

on:
  pull_request:
  push:
    branches: [development, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 -m unittest discover -s scripts/tests -v
      - run: npm ci
      - run: npm test
      - run: npm run build
