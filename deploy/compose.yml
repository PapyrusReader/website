name: papyrus-website

services:
  website:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    command: ['caddy', 'file-server', '--listen', ':8080', '--root', '/srv/site/current']
    volumes:
      - ./site:/srv/site:ro
    networks:
      edge:
        aliases: [papyrus-website]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  edge:
    external: true
    name: papyrus-edge
