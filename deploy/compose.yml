name: papyrus-website

services:
  website:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    volumes:
      - ./site:/srv/site:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/papyrus-status:/srv/status:ro
    networks:
      edge:
        aliases: [papyrus-website]
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8080/']
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  edge:
    external: true
    name: papyrus-edge
