<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papyrus service status</title>
  <meta name="description"
    content="Check the current availability of the Papyrus API and sync services.">
  <meta name="theme-color" content="#FFFBFF" id="meta-theme-color">
  <meta name="color-scheme" content="light dark">
  <meta property="og:title" content="Papyrus service status">
  <meta property="og:site_name" content="Papyrus">
  <meta property="og:description"
    content="Check the current availability of the Papyrus API and sync services.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://papyrus-reader.com/status/">
  <meta property="og:image" content="https://papyrus-reader.com/public/img/library-light.jpg">
  <meta property="og:image:width" content="2560">
  <meta property="og:image:height" content="1440">
  <meta property="og:image:alt" content="The Papyrus library, showing physical books and ebooks together">
  <link rel="canonical" href="https://papyrus-reader.com/status/">
  <link rel="icon" type="image/svg+xml" href="/public/favicon.svg">
  <link rel="icon" type="image/png" href="/public/favicon-96x96.png" sizes="96x96">
  <link rel="shortcut icon" href="/public/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/public/apple-touch-icon.png">
  <link rel="manifest" href="/public/site.webmanifest">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <nav class="navigation container" aria-label="Main navigation">
      <a class="brand" href="/" aria-label="Papyrus home">
        <img class="brand-light" src="/public/img/logo-light.svg" width="471" height="166" alt="Papyrus">
        <img class="brand-dark" src="/public/img/logo-dark.svg" width="471" height="166" alt="Papyrus">
      </a>
      <div class="nav-actions">
        <button class="theme-toggle" id="theme-toggle" type="button" hidden aria-label="Switch to dark theme"><svg
            class="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="1.7" aria-hidden="true">
            <path d="M20.8 13A9 9 0 0 1 11 3.2 9 9 0 1 0 20.8 13Z" />
          </svg><span id="theme-label">Dark</span></button>
        <button class="menu-toggle" id="menu-toggle" type="button" hidden aria-expanded="false"
          aria-controls="nav-links">Menu <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" />
          </svg></button>
      </div>
      <div class="nav-links" id="nav-links">
        <a href="/#about">About</a>
        <a href="/#downloads">Downloads</a>
        <a href="https://docs.papyrus-reader.com/">Docs</a>
        <a href="/status/" aria-current="page">Status</a>
        <a href="https://github.com/PapyrusReader/papyrus">GitHub <span aria-hidden="true">↗</span></a>
      </div>
    </nav>
  </header>
  <main id="main" class="container status-page">
    <h1>Service status</h1>
    <div class="status-summary"><h2 id="status-summary" aria-live="polite">Loading status…</h2></div>
    <noscript><p>Enable JavaScript to view service status.</p></noscript>
    <div class="status-grid">
      <article class="service-card" data-service="api"><div class="service-heading"><h2>API</h2><span class="service-state" data-state="unknown" aria-live="polite">Loading…</span></div><p>api.papyrus-reader.com</p></article>
      <article class="service-card" data-service="sync"><div class="service-heading"><h2>Sync</h2><span class="service-state" data-state="unknown" aria-live="polite">Loading…</span></div><p>sync.papyrus-reader.com</p></article>
    </div>
    <p class="status-note" id="status-updated"></p>
  </main>
  <footer class="site-footer container">
    <a class="footer-home" href="/">Papyrus</a>
    <p>Book library and reader.</p>
    <a href="https://github.com/PapyrusReader/client/blob/master/LICENSE">AGPL-3.0 license</a>
  </footer>
  <script src="/js/main.js" defer></script>
  <script src="/js/services.js" defer></script>
  <script src="/js/status.js" defer></script>
</body>
</html>
